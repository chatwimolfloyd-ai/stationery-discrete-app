<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Note Shop - ร้านเครื่องเขียนออนไลน์</title>
    <style>
        /* [DESIGN SYSTEM: Pastel Modern Theme] */
        :root {
            --bg-color: #F8F9FA;       /* สีครีม/เทาอ่อนพาสเทล */
            --card-bg: #FFFFFF;        /* สีขาว */
            --pink-pastel: #FFCCD5;    /* ชมพูพาสเทล */
            --green-pastel: #C7F9CC;   /* เขียวพาสเทล */
            --text-dark: #2C3E50;      /* สีเทาเข้มอ่านง่าย */
            --text-muted: #64748B;     /* สีเทาอ่อน */
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* Header Navigation Header */
        header {
            background-color: var(--card-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo img {
            object-fit: contain;
            border-radius: 10px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 25px;
            transition: all 0.3s;
            cursor: pointer;
        }

        nav a.active, nav a:hover {
            background-color: var(--pink-pastel);
            color: var(--text-dark);
        }

        .cart-badge {
            background: var(--green-pastel);
            color: var(--text-dark);
            font-size: 13px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: 6px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(135deg, #FFCCD5 0%, #C7F9CC 100%);
            color: var(--text-dark);
            padding: 60px 30px;
            border-radius: var(--border-radius);
            margin-bottom: 35px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 204, 213, 0.3);
        }

        .hero-banner h1 {
            font-size: 38px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .hero-banner p {
            font-size: 22px;
            opacity: 0.9;
            font-weight: 600;
            margin: 0 auto 25px auto;
            font-style: italic;
        }

        /* Category Bar */
        .category-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .category-chip {
            background: white;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #E2E8F0;
        }

        /* Section Title & Grid */
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #F1F5F9;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 22px rgba(0,0,0,0.06);
        }

        .card-img {
            height: 160px;
            background: #FFF5F7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card-badge {
            display: inline-block;
            background: #F1F5F9;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            width: fit-content;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #E67E22;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--pink-pastel);
            color: var(--text-dark);
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #FFB3C1;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-dark);
            border: 2px solid var(--pink-pastel);
        }

        .btn-outline:hover {
            background: var(--pink-pastel);
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 15px;
            }
            .hero-banner h1 {
                font-size: 28px;
            }
            .hero-banner p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Sweet Note Shop Logo" style="height: 100px; width: auto;">
                <span>Sweet Note Shop</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html" class="active">หน้าแรก</a></li>
                    <li><a href="products.html">สินค้าทั้งหมด</a></li>
                    <li>
                        <a href="cart.html">
                            ตะกร้าสินค้า
                            <span class="cart-badge" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- Hero Banner -->
        <section class="hero-banner">
            <h1>ยินดีต้อนรับสู่ Sweet Note Shop</h1>
            <p>Your Ideas, Our Pape :)</p>
            <a href="products.html" class="btn" style="display: inline-block; width: auto; padding: 12px 30px; background: var(--green-pastel);">เลือกชมสินค้า</a>
        </section>

        <!-- Category Bar -->
        <div class="category-bar" id="category-chips-container">
            <!-- Dynamic Content generated by Set Theory -->
        </div>

        <!-- Featured Products -->
        <section>
            <div class="section-title">
                <h2>สินค้าแนะนำ</h2>
                <a href="products.html" style="font-size: 14px; color: var(--text-dark); text-decoration: none; font-weight: bold;">ดูทั้งหมด →</a>
            </div>
            <div class="grid-3" id="featured-products-container">
                <!-- Dynamic Content -->
            </div>
        </section>
    </div>

    <script>
        // =========================================================================
        // [DISCRETE MATH: SET THEORY - Universal Set U]
        // นิยามเอกภพสัมพัทธ์ (Universal Set U) ซึ่งเป็นเซตของสินค้าทั้งหมดภายในร้าน
        // U = { p1, p2, p3, p4, p5, p6, p7, p8 }
        // =========================================================================
        const UNIVERSE_PRODUCTS = [
            { id: 1, name: "ปากกาลูกลื่น Gel Ink 0.5", category: "Pen", price: 25, inStock: true, icon: "🖊️" },
            { id: 2, name: "ดินสอกด Graph-X 0.5mm", category: "Pencil", price: 45, inStock: true, icon: "✏️" },
            { id: 3, name: "สมุดโน้ตปกหนัง Grid A5", category: "Paper", price: 120, inStock: true, icon: "📓" },
            { id: 4, name: "ปากกาเน้นข้อความ Pastel Pack", category: "Pen", price: 85, inStock: false, icon: "🖍️" },
            { id: 5, name: "ดินสอสีไม้ MasterArt 12 สี", category: "Pencil", price: 95, inStock: true, icon: "🎨" },
            { id: 6, name: "กระดาษโน้ต Sticky Notes 3x3", category: "Paper", price: 35, inStock: true, icon: "📑" },
            { id: 7, name: "ปากกาหมึกซึม Calligraphy", category: "Pen", price: 220, inStock: true, icon: "✒️" },
            { id: 8, name: "ไส้ดินสอกด 2B 0.5mm", category: "Pencil", price: 20, inStock: true, icon: "✏️" }
        ];

        // =========================================================================
        // [DISCRETE MATH: SET THEORY - Unique Category Extraction & Cardinality]
        // ประยุกต์ใช้ new Set(), .add() และ .size ในการสร้างเซตหมวดหมู่แบบไม่ซ้ำ
        // C = { c | ∃p ∈ U, p.category = c }
        // =========================================================================
        function initCategoryChips() {
            // สร้างอินสแตนซ์ของ Set เพื่อเก็บสมาชิกที่ไม่ซ้ำกัน
            const categorySet = new Set();
            
            // เพิ่มสมาชิกหมวดหมู่ลงใน Set (Set จะขจัดค่าซ้ำให้อัตโนมัติ)
            UNIVERSE_PRODUCTS.forEach(product => {
                categorySet.add(product.category);
            });

            // หาค่าขนาดของเซต (Cardinality |C|)
            const totalCategories = categorySet.size;

            // นำผลลัพธ์จากทฤษฎีเซตมาแสดงผลบน UI
            const container = document.getElementById('category-chips-container');
            container.innerHTML = `<span class="category-chip" style="background: var(--pink-pastel);">ทั้งหมด (${totalCategories} หมวดหมู่)</span>`;
            
            categorySet.forEach(category => {
                container.innerHTML += `<span class="category-chip">${category}</span>`;
            });
        }

        // =========================================================================
        // [DISCRETE MATH: LOGIC & CART STATE MANAGEMENT]
        // ใช้หลักตรรกศาสตร์ (if-else) ร่วมกับ localStorage ในการตรวจสอบสภาวะตะกร้า
        // =========================================================================
        function getCartFromStorage() {
            // ประพจน์เงื่อนไข: ตรวจสอบการมีอยู่ของข้อมูลใน localStorage
            const storedCart = localStorage.getItem('sweetnote_cart');
            if (storedCart !== null) {
                return JSON.parse(storedCart);
            } else {
                return [];
            }
        }

        function addToCart(productId) {
            // [DISCRETE MATH: LOGIC EVALUATION]
            const product = UNIVERSE_PRODUCTS.find(p => p.id === productId);
            
            // Evaluate logic condition: (product == null) OR (inStock == false)
            if (!product || !product.inStock) {
                alert("ขออภัย สินค้านี้หมดสต็อก");
                return;
            }

            let cart = getCartFromStorage();
            
            // ตรวจสอบสมาชิกภาพ (Membership Test) ว่าสินค้านี้อยู่ในตะกร้าแล้วหรือไม่
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id: product.id, name: product.name, price: product.price, icon: product.icon, quantity: 1 });
            }

            // บันทึกสถานะกลับไปยัง localStorage
            localStorage.setItem('sweetnote_cart', JSON.stringify(cart));
            
            updateCartBadge();
            renderFeaturedProducts();
        }

        function updateCartBadge() {
            const cart = getCartFromStorage();
            // คำนวณผลรวมจำนวนสินค้าทั้งหมดในตะกร้า
            let totalCount = 0;
            cart.forEach(item => {
                totalCount += item.quantity;
            });
            document.getElementById('cart-count').innerText = totalCount;
        }

        // แสดงผลสินค้าแนะนำ (เลือก 3 รายการแรกจาก Universal Set U)
        function renderFeaturedProducts() {
            const container = document.getElementById('featured-products-container');
            container.innerHTML = '';
            
            const cart = getCartFromStorage();
            // สร้าง Set ของ Product ID เพื่อใช้ตรวจสอบ Membership (x ∈ Cart)
            const cartItemIds = new Set(cart.map(item => item.id));

            // ดึงสับเซตของสินค้า 3 รายการแรก
            const featuredItems = UNIVERSE_PRODUCTS.slice(0, 3);

            featuredItems.forEach(product => {
                // ตรวจสอบตรรกศาสตร์ว่าสินค้าอยู่ในตะกร้าแล้วหรือยัง
                const isInCart = cartItemIds.has(product.id);

                container.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="card-img">${product.icon}</div>
                            <span class="card-badge">${product.category}</span>
                            <div class="card-title">${product.name}</div>
                            <div style="font-size: 12px; color: ${product.inStock ? 'green' : 'red'}; margin-bottom: 8px;">
                                ${product.inStock ? '● มีสินค้าพร้อมส่ง' : '○ สินค้าหมด'}
                            </div>
                        </div>
                        <div>
                            <div class="price">฿${product.price}</div>
                            <button class="btn ${isInCart ? 'btn-outline' : ''}" 
                                ${!product.inStock ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}
                                onclick="addToCart(${product.id})">
                                ${isInCart ? 'เพิ่มอีก 1 ชิ้น' : 'เพิ่มลงตะกร้า'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // เริ่มการทำงานระบบเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            initCategoryChips();
            updateCartBadge();
            renderFeaturedProducts();
        };
    </script>
</body>
</html>
